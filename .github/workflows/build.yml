name: Build Check

# Pure build validation: makes sure `rojo build` still succeeds. Runs on
# every push (any branch) and PR. Does not tag or release anything -- see
# release.yml for that.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .rbxm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rojo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rojo-dl
          gh release download --repo rojo-rbx/rojo --pattern '*linux-x86_64.zip' --dir rojo-dl --clobber
          unzip -o rojo-dl/*.zip -d rojo-bin
          sudo install -m 0755 rojo-bin/rojo /usr/local/bin/rojo
          rojo --version

      - name: Build plugin
        run: rojo build default.project.json --output RCEAnimationMigrator.rbxm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCEAnimationMigrator
          path: RCEAnimationMigrator.rbxm
          if-no-files-found: error
